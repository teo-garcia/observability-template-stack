global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: observability-template-stack
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: tempo
    scrape_interval: 30s
    scrape_timeout: 5s
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]

  - job_name: container-service
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/container-services.yml"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [service]
        target_label: job
      - source_labels: [service]
        target_label: service

  - job_name: static-web
    metrics_path: /probe
    params:
      module: [http_2xx_tls]
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/static-sites.yml"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [service]
        target_label: service
      - target_label: __address__
        replacement: blackbox:9115
