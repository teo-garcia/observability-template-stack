name: observability-template-stack-production

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - observability
  security_opt:
    - no-new-privileges:true

services:
  otel-collector:
    <<: *service-defaults
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./otel-collector/config.production.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - tempo
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./prometheus/prometheus.production.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/file_sd:/etc/prometheus/file_sd:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
      - blackbox
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128

  alertmanager:
    <<: *service-defaults
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - 127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    mem_limit: 96m
    cpus: 0.20
    pids_limit: 64

  blackbox:
    <<: *service-defaults
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    mem_limit: 64m
    cpus: 0.20
    pids_limit: 64

  tempo:
    <<: *service-defaults
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo/tempo.production.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128

  loki:
    <<: *service-defaults
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.production.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128

  alloy:
    <<: *service-defaults
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 96

  grafana:
    <<: *service-defaults
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL: grafana-exploretraces-app@2.2.0
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    volumes:
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
      - alloy
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128

volumes:
  alertmanager_data:
  alloy_data:
  grafana_data:
  loki_data:
  prometheus_data:
  tempo_data:

networks:
  observability:
    name: ${OBSERVABILITY_NETWORK:-templates-observability}
    external: true
