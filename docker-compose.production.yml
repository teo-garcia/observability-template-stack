name: observability-template-stack-production

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - observability
  security_opt:
    - no-new-privileges:true

services:
  otel-collector:
    <<: *service-defaults
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./otel-collector/config.production.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - tempo
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./prometheus/prometheus.production.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/file_sd:/etc/prometheus/file_sd:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
      - blackbox
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128

  alertmanager:
    <<: *service-defaults
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - 127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    mem_limit: 96m
    cpus: 0.20
    pids_limit: 64

  blackbox:
    <<: *service-defaults
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    mem_limit: 64m
    cpus: 0.20
    pids_limit: 64

  tempo:
    <<: *service-defaults
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo/tempo.production.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128

  loki:
    <<: *service-defaults
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.production.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128

  alloy:
    <<: *service-defaults
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 96

  grafana:
    <<: *service-defaults
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL: grafana-exploretraces-app@2.2.0
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    volumes:
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
      - alloy
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128

volumes:
  alertmanager_data:
  alloy_data:
  grafana_data:
  loki_data:
  prometheus_data:
  tempo_data:

networks:
  observability:
    name: ${OBSERVABILITY_NETWORK:-templates-observability}
    external: true
